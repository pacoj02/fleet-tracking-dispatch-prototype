<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Carrier - Dispatch Board (Prototype)</title>
<style>html,body{margin:0;background:#14171C;}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ---------- constants ----------
const STATUSES = ["Unassigned", "Assigned", "En Route", "Delivered"];
const STATUS_COLOR = {
  Unassigned: { bg: "#3A2420", text: "#E4572E", dot: "#E4572E" },
  Assigned: { bg: "#33301C", text: "#F5A623", dot: "#F5A623" },
  "En Route": { bg: "#1C2E3A", text: "#4FB4DE", dot: "#4FB4DE" },
  Delivered: { bg: "#1C3324", text: "#4C9A6A", dot: "#4C9A6A" },
};
const DRIVER_STATUSES = ["Available", "On Job", "Off Duty"];
const DRIVER_COLOR = {
  Available: "#4C9A6A",
  "On Job": "#F5A623",
  "Off Duty": "#6B7280",
};

const STORAGE_KEY = "dispatch-board-data";

const uid = () => Math.random().toString(36).slice(2, 9);

const emptyJob = () => ({
  id: uid(),
  ticket: "",
  customer: "",
  origin: "",
  destination: "",
  scheduled: "",
  status: "Unassigned",
  driverId: "",
  notes: "",
  created: new Date().toISOString(),
});

const emptyDriver = () => ({
  id: uid(),
  name: "",
  truck: "",
  phone: "",
  status: "Available",
});

// ---------- app ----------
function DispatchBoard() {
  const [drivers, setDrivers] = useState([]);
  const [jobs, setJobs] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [showDriverForm, setShowDriverForm] = useState(false);
  const [showJobForm, setShowJobForm] = useState(false);
  const [driverDraft, setDriverDraft] = useState(emptyDriver());
  const [jobDraft, setJobDraft] = useState(emptyJob());
  const [expandedJob, setExpandedJob] = useState(null);
  const [error, setError] = useState("");
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  // load
  useEffect(() => {
    (async () => {
      try {
        const res = localStorage.getItem(STORAGE_KEY);
        if (res) {
          const parsed = JSON.parse(res);
          setDrivers(parsed.drivers || []);
          setJobs(parsed.jobs || []);
        }
      } catch (e) {
        // key not found is fine for first run
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(async (nextDrivers, nextJobs) => {
    setSaving(true);
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({ drivers: nextDrivers, jobs: nextJobs })
      );
      setError("");
    } catch (e) {
      setError("Couldn't save, changes may not persist.");
    } finally {
      setSaving(false);
    }
  }, []);

  useEffect(() => {
    if (loaded) persist(drivers, jobs);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [drivers, jobs, loaded]);

  // ---------- driver ops ----------
  const addDriver = () => {
    if (!driverDraft.name.trim()) return;
    setDrivers((d) => [...d, { ...driverDraft, id: uid() }]);
    setDriverDraft(emptyDriver());
    setShowDriverForm(false);
  };

  const setDriverStatus = (id, status) => {
    setDrivers((ds) => ds.map((d) => (d.id === id ? { ...d, status } : d)));
  };

  const removeDriver = (id) => {
    setDrivers((ds) => ds.filter((d) => d.id !== id));
    setJobs((js) => js.map((j) => (j.driverId === id ? { ...j, driverId: "" } : j)));
  };

  // ---------- job ops ----------
  const addJob = () => {
    if (!jobDraft.customer.trim() || !jobDraft.destination.trim()) return;
    const ticket = jobDraft.ticket.trim() || `T-${1000 + jobs.length + 1}`;
    setJobs((j) => [...j, { ...jobDraft, ticket, id: uid() }]);
    setJobDraft(emptyJob());
    setShowJobForm(false);
  };

  const updateJob = (id, patch) => {
    setJobs((js) =>
      js.map((j) => {
        if (j.id !== id) return j;
        const updated = { ...j, ...patch };
        // auto status bump when a driver gets assigned to an unassigned job
        if (patch.driverId && j.status === "Unassigned") {
          updated.status = "Assigned";
        }
        if (patch.driverId === "" && (j.status === "Assigned" || j.status === "En Route")) {
          updated.status = "Unassigned";
        }
        return updated;
      })
    );
  };

  const removeJob = (id) => {
    setJobs((js) => js.filter((j) => j.id !== id));
    setExpandedJob((e) => (e === id ? null : e));
  };

  const driverName = (id) => drivers.find((d) => d.id === id)?.name || "";

  const availableDrivers = drivers.filter((d) => d.status !== "Off Duty");

  const jobsByStatus = (status) => jobs.filter((j) => j.status === status);

  const timeStr = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dateStr = now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });

  return (
    <div style={styles.app}>
      <style>{fontImport}</style>

      {/* header */}
      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <div style={styles.logoMark}>SC</div>
          <div>
            <div style={styles.brand}>SAMPLE CARRIER</div>
            <div style={styles.brandSub}>Dispatch Board</div>
          </div>
        </div>
        <div style={styles.headerRight}>
          <div style={styles.clockWrap}>
            <div style={styles.clockTime}>{timeStr}</div>
            <div style={styles.clockDate}>{dateStr}</div>
          </div>
          <span style={styles.saveIndicator(saving)}>
            {saving ? "SAVING…" : "SYNCED"}
          </span>
        </div>
      </header>

      {error && <div style={styles.errorBar}>{error}</div>}

      <div style={styles.body}>
        {/* roster sidebar */}
        <aside style={styles.sidebar}>
          <div style={styles.sidebarHead}>
            <span style={styles.sidebarTitle}>ROSTER</span>
            <button style={styles.smallAddBtn} onClick={() => setShowDriverForm((s) => !s)}>
              {showDriverForm ? "×" : "+"}
            </button>
          </div>

          {showDriverForm && (
            <div style={styles.formCard}>
              <input
                style={styles.input}
                placeholder="Driver name"
                value={driverDraft.name}
                onChange={(e) => setDriverDraft({ ...driverDraft, name: e.target.value })}
              />
              <input
                style={styles.input}
                placeholder="Truck # / unit"
                value={driverDraft.truck}
                onChange={(e) => setDriverDraft({ ...driverDraft, truck: e.target.value })}
              />
              <input
                style={styles.input}
                placeholder="Phone"
                value={driverDraft.phone}
                onChange={(e) => setDriverDraft({ ...driverDraft, phone: e.target.value })}
              />
              <button style={styles.primaryBtn} onClick={addDriver}>
                Add driver
              </button>
            </div>
          )}

          <div style={styles.driverList}>
            {drivers.length === 0 && !showDriverForm && (
              <div style={styles.emptyNote}>No drivers on the roster yet.</div>
            )}
            {drivers.map((d) => (
              <div key={d.id} style={styles.driverCard}>
                <div style={styles.driverTop}>
                  <span style={styles.driverName}>{d.name}</span>
                  <button style={styles.ghostX} onClick={() => removeDriver(d.id)} title="Remove driver">
                    ×
                  </button>
                </div>
                <div style={styles.driverMeta}>
                  {d.truck && <span>Unit {d.truck}</span>}
                  {d.phone && <span> · {d.phone}</span>}
                </div>
                <select
                  style={{ ...styles.statusSelect, color: DRIVER_COLOR[d.status] }}
                  value={d.status}
                  onChange={(e) => setDriverStatus(d.id, e.target.value)}
                >
                  {DRIVER_STATUSES.map((s) => (
                    <option key={s} value={s} style={{ color: "#111" }}>
                      {s}
                    </option>
                  ))}
                </select>
              </div>
            ))}
          </div>
        </aside>

        {/* board */}
        <main style={styles.board}>
          <div style={styles.boardHead}>
            <span style={styles.boardTitle}>JOBS</span>
            <button style={styles.primaryBtn} onClick={() => setShowJobForm((s) => !s)}>
              {showJobForm ? "Cancel" : "+ New job"}
            </button>
          </div>

          {showJobForm && (
            <div style={styles.jobFormCard}>
              <div style={styles.jobFormGrid}>
                <input
                  style={styles.input}
                  placeholder="Ticket # (auto if blank)"
                  value={jobDraft.ticket}
                  onChange={(e) => setJobDraft({ ...jobDraft, ticket: e.target.value })}
                />
                <input
                  style={styles.input}
                  placeholder="Customer"
                  value={jobDraft.customer}
                  onChange={(e) => setJobDraft({ ...jobDraft, customer: e.target.value })}
                />
                <input
                  style={styles.input}
                  placeholder="Origin"
                  value={jobDraft.origin}
                  onChange={(e) => setJobDraft({ ...jobDraft, origin: e.target.value })}
                />
                <input
                  style={styles.input}
                  placeholder="Destination"
                  value={jobDraft.destination}
                  onChange={(e) => setJobDraft({ ...jobDraft, destination: e.target.value })}
                />
                <input
                  style={styles.input}
                  placeholder="Scheduled (e.g. 07/16 07:30)"
                  value={jobDraft.scheduled}
                  onChange={(e) => setJobDraft({ ...jobDraft, scheduled: e.target.value })}
                />
                <select
                  style={styles.input}
                  value={jobDraft.driverId}
                  onChange={(e) => setJobDraft({ ...jobDraft, driverId: e.target.value })}
                >
                  <option value="">Assign driver (optional)</option>
                  {drivers.map((d) => (
                    <option key={d.id} value={d.id}>
                      {d.name}
                    </option>
                  ))}
                </select>
              </div>
              <textarea
                style={{ ...styles.input, width: "100%", minHeight: 50, marginTop: 8 }}
                placeholder="Notes"
                value={jobDraft.notes}
                onChange={(e) => setJobDraft({ ...jobDraft, notes: e.target.value })}
              />
              <button style={{ ...styles.primaryBtn, marginTop: 8 }} onClick={addJob}>
                Create job
              </button>
            </div>
          )}

          <div style={styles.columns}>
            {STATUSES.map((status) => (
              <div key={status} style={styles.column}>
                <div style={styles.columnHead}>
                  <span style={{ ...styles.columnDot, background: STATUS_COLOR[status].dot }} />
                  <span style={styles.columnTitle}>{status}</span>
                  <span style={styles.columnCount}>{jobsByStatus(status).length}</span>
                </div>
                <div style={styles.columnList}>
                  {jobsByStatus(status).length === 0 && (
                    <div style={styles.emptyNote}>—</div>
                  )}
                  {jobsByStatus(status).map((j) => (
                    <div key={j.id} style={styles.jobCard}>
                      <div style={styles.jobCardTop}>
                        <span style={styles.ticket}>{j.ticket}</span>
                        <button style={styles.ghostX} onClick={() => removeJob(j.id)} title="Delete job">
                          ×
                        </button>
                      </div>
                      <div style={styles.jobCustomer}>{j.customer}</div>
                      <div style={styles.jobRoute}>
                        {j.origin || "—"} <span style={styles.arrow}>→</span> {j.destination}
                      </div>
                      {j.scheduled && <div style={styles.jobSched}>⏱ {j.scheduled}</div>}

                      <div style={styles.jobControls}>
                        <select
                          style={styles.input}
                          value={j.driverId}
                          onChange={(e) => updateJob(j.id, { driverId: e.target.value })}
                        >
                          <option value="">Unassigned</option>
                          {availableDrivers.map((d) => (
                            <option key={d.id} value={d.id}>
                              {d.name}
                            </option>
                          ))}
                        </select>
                        <select
                          style={{ ...styles.input, color: STATUS_COLOR[j.status].text }}
                          value={j.status}
                          onChange={(e) => updateJob(j.id, { status: e.target.value })}
                        >
                          {STATUSES.map((s) => (
                            <option key={s} value={s} style={{ color: "#111" }}>
                              {s}
                            </option>
                          ))}
                        </select>
                      </div>

                      {j.driverId && (
                        <div style={styles.jobDriver}>Driver: {driverName(j.driverId)}</div>
                      )}

                      <button
                        style={styles.notesToggle}
                        onClick={() => setExpandedJob(expandedJob === j.id ? null : j.id)}
                      >
                        {expandedJob === j.id ? "Hide notes" : "Notes"}
                      </button>
                      {expandedJob === j.id && (
                        <textarea
                          style={{ ...styles.input, width: "100%", minHeight: 50, marginTop: 6 }}
                          value={j.notes}
                          onChange={(e) => updateJob(j.id, { notes: e.target.value })}
                          placeholder="Add notes…"
                        />
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </main>
      </div>
    </div>
  );
}

// ---------- styles ----------
const fontImport = `
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
`;

  },

  },

  },

  headerRight: { display: "flex", alignItems: "center", gap: 16 },
  clockWrap: { textAlign: "right" },
  clockTime: {

    color: "#F5A623",
    lineHeight: 1,
  },
  clockDate: { fontSize: 10, color: "#8B8F99", marginTop: 2, textTransform: "uppercase", letterSpacing: 1 },
  saveIndicator: (saving) => ({

    letterSpacing: 1,
    color: saving ? "#F5A623" : "#4C9A6A",
    border: `1px solid ${saving ? "#F5A623" : "#4C9A6A"}`,
    borderRadius: 4,
    padding: "3px 8px",
  }),
  errorBar: {
    background: "#3A2420",
    color: "#E4572E",
    fontSize: 12,
    padding: "6px 20px",
    borderBottom: "1px solid #2A2E37",
  },
  body: { display: "flex", flex: 1, minHeight: 0 },
  sidebar: {
    width: 250,
    borderRight: "1px solid #2A2E37",
    padding: 16,
    overflowY: "auto",
    background: "#171A20",
  },
  sidebarHead: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 },
  sidebarTitle: {
    fontFamily: "'Oswald', sans-serif",
    fontSize: 13,
    letterSpacing: 1.5,
    color: "#8B8F99",
  },
  smallAddBtn: {
    width: 24,
    height: 24,
    borderRadius: 5,
    background: "#F5A623",

    fontWeight: 700,
    cursor: "pointer",

  },
  formCard: {

  },

    padding: 0,

};

ReactDOM.createRoot(document.getElementById("root")).render(<DispatchBoard />);
</script>
</body>
</html>
