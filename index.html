<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sample Carrier - Live Fleet Tracking (Mockup)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C; --panel:#181B21; --panel2:#1E222A; --border:#2A2E37;
    --text:#E8E6DE; --muted:#8B8F99; --amber:#F5A623; --green:#4C9A6A;
    --red:#E4572E; --blue:#4FB4DE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);
    flex-shrink:0; z-index:10;
  }
  .brandwrap{display:flex;align-items:center;gap:12px;}
  .logo{width:36px;height:36px;border-radius:6px;background:var(--amber);color:var(--bg);
    display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;}
  .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:1px;}
  .brandsub{font-size:10.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;
    border:1px solid var(--amber);color:var(--amber);border-radius:4px;padding:3px 8px;
  }
  .headerRight{display:flex;align-items:center;gap:14px;}
  .clock{font-family:'JetBrains Mono',monospace;color:var(--amber);font-size:16px;}

  .body{flex:1;display:flex;min-height:0;}
  aside{
    width:280px;background:#171A20;border-right:1px solid var(--border);
    padding:14px;overflow-y:auto;flex-shrink:0;
  }
  .sectionTitle{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px;}
  .truckCard{
    background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
  }
  .truckCard:hover{border-color:var(--amber);}
  .truckCard.active{border-color:var(--amber);background:#242118;}
  .truckTop{display:flex;justify-content:space-between;align-items:center;}
  .truckName{font-weight:600;font-size:13.5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
  .truckMeta{font-size:11px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .truckStatus{font-size:11px;margin-top:6px;font-weight:600;}
  .legend{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
  .legendRow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .legendSwatch{width:16px;height:3px;border-radius:2px;}
  .legendSwatchDashed{width:16px;height:0;border-top:2px dashed var(--amber);}

  #map{flex:1;background:#0d0f13;}

  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:8px;border:1px solid var(--border);}
  .leaflet-popup-tip{background:var(--panel2);}
  .popupTitle{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;margin-bottom:4px;}
  .popupRow{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  .mockBanner{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(245,166,35,0.95);color:#14171C;font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:600;letter-spacing:0.5px;padding:5px 14px;border-radius:6px;
    z-index:500;
  }

  /* ---- AI situational awareness panel ---- */
  #attentionPanel{
    position:absolute; top:52px; right:14px; width:330px; max-height:calc(100% - 70px);
    background:rgba(23,26,32,0.94); border:1px solid var(--border); border-radius:10px;
    z-index:500; display:flex; flex-direction:column; backdrop-filter:blur(4px);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .apHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; border-bottom:1px solid var(--border);
  }
  .apTitle{font-family:'Oswald',sans-serif;font-size:12.5px;letter-spacing:1.2px;color:var(--text);}
  .apTitle span{color:var(--amber);}
  .apPulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
  .apBody{overflow-y:auto; padding:10px 10px 12px; display:flex; flex-direction:column; gap:8px;}
  .apEmpty{font-size:11.5px; color:var(--muted); font-style:italic; padding:6px 2px;}

  .alertCard{
    border-radius:8px; padding:9px 10px; border:1px solid var(--border);
    background:var(--panel2); border-left-width:3px; animation:slideIn .25s ease-out;
  }
  @keyframes slideIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
  .alertCard.low{border-left-color:var(--muted);}
  .alertCard.medium{border-left-color:var(--amber);}
  .alertCard.high{border-left-color:var(--red);}
  .alertTop{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .alertSev{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:1px;
    text-transform:uppercase; padding:2px 6px; border-radius:3px; font-weight:600;
  }
  .alertSev.low{color:var(--muted); background:#20242d;}
  .alertSev.medium{color:var(--amber); background:#33301c;}
  .alertSev.high{color:var(--red); background:#3a2420;}
  .alertTime{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted);}
  .alertMsg{font-size:12px; line-height:1.4; color:var(--text);}
  .alertMsg b{color:var(--amber);}

  .draftBox{
    margin-top:8px; background:#14171C; border:1px solid var(--border); border-radius:6px;
    padding:8px 9px;
  }
  .draftLabel{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--muted); letter-spacing:0.5px; margin-bottom:4px; text-transform:uppercase;}
  .draftText{font-size:11.5px; color:#D7D5CC; line-height:1.4; margin-bottom:8px;}
  .draftActions{display:flex; gap:6px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600; border:none; border-radius:5px;
    padding:6px 10px; cursor:pointer;
  }
  .btnApprove{background:var(--amber); color:#14171C;}
  .btnEdit{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .sentTag{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--green);
    display:flex; align-items:center; gap:5px;
  }
  .sentTag::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block;}
  .autoTag{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--red); letter-spacing:0.5px;
    background:#3a2420; padding:2px 6px; border-radius:3px; margin-left:6px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandwrap">
      <div class="logo">SC</div>
      <div>
        <div class="brand">SAMPLE CARRIER</div>
        <div class="brandsub">Live Fleet Tracking</div>
      </div>
      <span class="badge">MOCKUP - DEMO DATA</span>
    </div>
    <div class="headerRight">
      <div class="clock" id="clock">--:--</div>
    </div>
  </header>

  <div class="body">
    <aside>
      <div class="sectionTitle">ACTIVE TRUCKS</div>
      <div id="truckList"></div>

      <div class="legend">
        <div class="sectionTitle" style="margin-bottom:10px;">MAP KEY</div>
        <div class="legendRow"><span class="legendSwatchDashed"></span> Approved route</div>
        <div class="legendRow"><span class="legendSwatch" style="background:#4FB4DE;"></span> Actual path driven</div>
        <div class="legendRow"><span class="dot" style="background:#4C9A6A;"></span> On approved route</div>
        <div class="legendRow"><span class="dot" style="background:#E4572E;"></span> Off route / deviation</div>
      </div>
    </aside>
    <div style="flex:1;position:relative;">
      <div class="mockBanner">Simulated positions - not yet connected to Geotab</div>

      <div id="attentionPanel">
        <div class="apHead">
          <span class="apTitle"><span>AI</span> SITUATIONAL AWARENESS</span>
          <span class="apPulse"></span>
        </div>
        <div class="apBody" id="apBody">
          <div class="apEmpty">Monitoring fleet… alerts will appear here.</div>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- mock data: eastern Ohio water-hauling routes ----------
const trucks = [
  {
    id: "T-104", driver: "R. Alvarez", unit: "104",
    customer: "Acme Water Co.", notifyMode: "approve", stagingThreshold: 20,
    approved: [
      [40.0298,-81.5843],[40.010,-81.560],[39.985,-81.545],[39.9737,-81.5335]
    ],
    speedMph: 42, deviates: false
  },
  {
    id: "T-108", driver: "K. Morrow", unit: "108",
    customer: "Guernsey Concrete", notifyMode: "none", stagingThreshold: null,
    approved: [
      [39.9095,-81.5245],[39.895,-81.495],[39.870,-81.465],[39.850,-81.440]
    ],
    speedMph: 38, deviates: false
  },
  {
    id: "T-111", driver: "D. Lucas", unit: "111",
    customer: "Cambridge Utilities", notifyMode: "auto", stagingThreshold: 15,
    approved: [
      [40.0298,-81.5843],[40.055,-81.610],[40.080,-81.650],[40.100,-81.690]
    ],
    speedMph: 45, deviates: true // this one will wander off approved route
  }
];

// densify a route into small steps for smooth animation
function densify(points, stepsPerSeg){
  const out=[];
  for(let i=0;i<points.length-1;i++){
    const [lat1,lng1]=points[i], [lat2,lng2]=points[i+1];
    for(let s=0;s<stepsPerSeg;s++){
      const t=s/stepsPerSeg;
      out.push([lat1+(lat2-lat1)*t, lng1+(lng2-lng1)*t]);
    }
  }
  out.push(points[points.length-1]);
  return out;
}

// build actual path: mostly follows approved route, one truck deviates partway
function buildActual(truck){
  const dense = densify(truck.approved, 24);
  if(!truck.deviates) return dense;
  // inject a deviation bulge in the middle third
  const start = Math.floor(dense.length*0.35);
  const end = Math.floor(dense.length*0.6);
  const out = dense.slice();
  for(let i=start;i<end;i++){
    const t = (i-start)/(end-start);
    const bulge = Math.sin(t*Math.PI) * 0.045;
    out[i] = [out[i][0]+bulge, out[i][1]-bulge*0.6];
  }
  return out;
}

trucks.forEach(t=>{
  t.approvedDense = densify(t.approved, 24);
  t.actualPath = buildActual(t);
  t.pos = 0; // index into actualPath
});

// ---------- AI situational awareness feed ----------
const attentionFeed = []; // {id, severity, msg, time, draft, notifyMode, customer, sent}
let feedCounter = 0;

function timeNow(){
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function pushAlert(entry){
  entry.id = 'a' + (feedCounter++);
  entry.time = timeNow();
  attentionFeed.unshift(entry);
  renderAttentionPanel();
}

function renderAttentionPanel(){
  const body = document.getElementById('apBody');
  if(attentionFeed.length === 0){
    body.innerHTML = '<div class="apEmpty">Monitoring fleet… alerts will appear here.</div>';
    return;
  }
  body.innerHTML = attentionFeed.map(a => `
    <div class="alertCard ${a.severity}">
      <div class="alertTop">
        <span class="alertSev ${a.severity}">${a.severity}</span>
        <span class="alertTime">${a.time}</span>
      </div>
      <div class="alertMsg">${a.msg}</div>
      ${a.draft ? `
        <div class="draftBox">
          <div class="draftLabel">Drafted customer update - ${a.customer}
            ${a.notifyMode === 'auto' ? '<span class="autoTag">AUTO-SEND ACCOUNT</span>' : ''}
          </div>
          <div class="draftText">${a.draft}</div>
          ${a.sent
            ? `<span class="sentTag">${a.notifyMode === 'auto' ? 'Auto-sent to customer' : 'Sent to customer'}</span>`
            : `<div class="draftActions">
                 <button class="btn btnApprove" onclick="approveAlert('${a.id}')">Approve &amp; Send</button>
                 <button class="btn btnEdit" onclick="alert('Demo only - editing not wired up in this mockup.')">Edit</button>
               </div>`
          }
        </div>
      ` : ''}
    </div>
  `).join('');
}

window.approveAlert = function(id){
  const a = attentionFeed.find(x => x.id === id);
  if(a){ a.sent = true; renderAttentionPanel(); }
};

// scripted demo timeline (runs once, keyed to tick count)
let demoTick = 0;
function runScriptedEvents(){
  demoTick++;

  if(demoTick === 3){
    pushAlert({
      severity:'low',
      msg:`<b>T-108</b> on schedule, no staging detected - no action needed.`
    });
  }

  if(demoTick === 5){
    pushAlert({
      severity:'medium',
      msg:`<b>T-104</b> staged at Cumberland site for 16 min - approaching Acme Water Co.'s 20-min staging threshold.`
    });
  }

  if(demoTick === 9){
    pushAlert({
      severity:'high',
      msg:`<b>T-104</b> staging time hit 24 min - past threshold. Draft update ready for dispatcher review.`,
      draft:`Hi team - just a heads up, our truck (T-104) has been staged longer than expected at the Cumberland site (24 min, vs. our usual ~20). No cause for concern, just keeping you in the loop. New ETA to follow shortly.`,
      customer:'Acme Water Co.', notifyMode:'approve', sent:false
    });
  }
}

// deviation detection hooked into the animation loop below
trucks.forEach(t => t.deviationAlerted = false);

const map = L.map('map', { zoomControl:true }).setView([39.98,-81.55], 10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO',
  subdomains:'abcd', maxZoom:19
}).addTo(map);

const truckIcon = (color) => L.divIcon({
  className:'', html:`<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #14171C;box-shadow:0 0 6px ${color};"></div>`,
  iconSize:[16,16], iconAnchor:[8,8]
});

trucks.forEach(t=>{
  // approved route (dashed amber)
  L.polyline(t.approvedDense, { color:'#F5A623', weight:2, dashArray:'6,6', opacity:0.65 }).addTo(map);
  // actual path trail (blue), starts empty, grows as we animate
  t.trailLine = L.polyline([t.actualPath[0]], { color:'#4FB4DE', weight:3, opacity:0.85 }).addTo(map);
  // marker
  const isOff = t.deviates;
  t.marker = L.marker(t.actualPath[0], { icon: truckIcon(isOff? '#F5A623' : '#4C9A6A') }).addTo(map);
  t.marker.bindPopup(`
    <div class="popupTitle">${t.id} - Unit ${t.unit}</div>
    <div class="popupRow">Driver: ${t.driver}</div>
    <div class="popupRow" id="popspeed-${t.id}">Speed: ${t.speedMph} mph</div>
    <div class="popupRow" id="popstatus-${t.id}">Status: On route</div>
  `);
});

// fit map to all approved routes
const allPts = trucks.flatMap(t=>t.approved);
map.fitBounds(L.latLngBounds(allPts), { padding:[40,40] });

// ---------- sidebar ----------
function statusFor(t){
  const idx=t.pos;
  const start = Math.floor(t.actualPath.length*0.35);
  const end = Math.floor(t.actualPath.length*0.6);
  if(t.deviates && idx>=start && idx<=end) return {label:'Off route', color:'#E4572E'};
  return {label:'On approved route', color:'#4C9A6A'};
}

function renderSidebar(){
  const list = document.getElementById('truckList');
  list.innerHTML = '';
  trucks.forEach(t=>{
    const st = statusFor(t);
    const card = document.createElement('div');
    card.className='truckCard';
    card.innerHTML = `
      <div class="truckTop">
        <span class="truckName"><span class="dot" style="background:${st.color}"></span>${t.id}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);">Unit ${t.unit}</span>
      </div>
      <div class="truckMeta">${t.driver} · ${t.speedMph} mph</div>
      <div class="truckStatus" style="color:${st.color};">${st.label}</div>
    `;
    card.onclick = ()=>{ map.panTo(t.marker.getLatLng()); t.marker.openPopup(); };
    list.appendChild(card);
  });
}
renderSidebar();

// ---------- animation loop ----------
function tick(){
  runScriptedEvents();
  trucks.forEach(t=>{
    t.pos = (t.pos + 1) % t.actualPath.length;
    const p = t.actualPath[t.pos];
    t.marker.setLatLng(p);
    const st = statusFor(t);
    t.marker.setIcon(truckIcon(st.color));
    // extend trail (reset when it loops)
    const trailPts = t.actualPath.slice(0, t.pos+1);
    t.trailLine.setLatLngs(trailPts.length>1?trailPts:[p,p]);
    // update popup content if open
    const popEl = document.getElementById(`popstatus-${t.id}`);
    if(popEl) popEl.textContent = `Status: ${st.label}`;

    // route deviation -> AI alert (fires once per loop when entering off-route zone)
    if(st.label === 'Off route' && !t.deviationAlerted){
      t.deviationAlerted = true;
      const isAuto = t.notifyMode === 'auto';
      pushAlert({
        severity:'high',
        msg:`<b>${t.id}</b> has deviated from its approved route near ${t.driver.split(' ')[1]}'s current leg. Flagged for ${t.customer}.`,
        draft:`Quick update - our truck (${t.id}) took a short detour off the planned route, likely a road condition or local reroute. Still tracking to deliver on schedule. We'll follow up if anything changes.`,
        customer:t.customer, notifyMode:t.notifyMode, sent:isAuto
      });
    }
    if(st.label !== 'Off route' && t.deviationAlerted && t.pos < 5){
      t.deviationAlerted = false; // reset after full loop so demo can repeat
    }
  });
  renderSidebar();
}
setInterval(tick, 1400);

// ---------- clock ----------
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
updateClock();
setInterval(updateClock, 15000);
</script>
</body>
</html>
